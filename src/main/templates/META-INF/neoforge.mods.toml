modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Evolution Hints contributors"
description='''
Adds a small evolution indicator to Cobblemon's PC storage slots and shows a
spoiler-free tooltip explaining how each Pokémon evolves. Evolution targets are
only shown after they have been encountered in the Pokédex.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cobblemon"
    type="required"
    versionRange="${cobblemon_version_range}"
    ordering="AFTER"
    side="BOTH"
